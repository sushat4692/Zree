[package]
name = "zree-core"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
unicode-normalization = "0.1"
# https: macOS uses SecureTransport, Android uses OpenSSL (vendored below)
git2 = { version = "0.21", features = ["https"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "android")'.dependencies]
# cross-compiled OpenSSL for libgit2's HTTPS backend on Android
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
