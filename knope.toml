# Three packages, released separately: the core has its own version so a bug can be traced to
# the change that introduced it, and each app carries its own number because they ship apart.
#
# Every build records the core it bundled (Info.plist `ZreeCoreVersion`, Android
# `BuildConfig.CORE_VERSION`), so "which core was in the build that misbehaved?" is answered
# by the artifact itself — no bookkeeping in the app changelogs.

[packages.core]
versioned_files = ["core/Cargo.toml"]
changelog = "core/CHANGELOG.md"

[packages.macos]
versioned_files = [{ path = "macos/VERSION", regex = "(?P<version>\\d+\\.\\d+\\.\\d+)" }]
changelog = "macos/CHANGELOG.md"

[packages.android]
versioned_files = [{ path = "android/VERSION", regex = "(?P<version>\\d+\\.\\d+\\.\\d+)" }]
changelog = "android/CHANGELOG.md"

[[workflows]]
name = "release"
help_text = "Bump the packages named by the pending change files, write CHANGELOGs, tag"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "document-change"
help_text = "Create a change file for the next release"

[[workflows.steps]]
type = "CreateChangeFile"
